<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M 25,95 C 25,50 35,40 50,40 C 65,40 75,50 75,95 Z" fill="#4c1d95" /> <!-- robe -->
    <rect x="42" y="40" width="16" height="55" fill="#3b0764" /> <!-- inner robe -->
    <circle cx="50" cy="32" r="14" fill="#fca5a5" /> <!-- head -->
    <path d="M 36,32 Q 50,65 64,32 Q 50,45 36,32 Z" fill="#f3f4f6" /> <!-- beard -->
    <path d="M 15,35 L 50,5 L 85,35 Z" fill="#2e1065" /> <!-- hat brim -->
    <path d="M 30,25 Q 40,5 60,0 Q 55,20 70,25 Z" fill="#2e1065" /> <!-- hat tip -->
    <line x1="80" y1="95" x2="80" y2="15" stroke="#78350f" stroke-width="4" stroke-linecap="round" /> <!-- staff -->
    <circle cx="80" cy="12" r="6" fill="#06b6d4" /> <!-- staff gem -->
    <path d="M 35,60 C 20,60 20,70 20,70 C 20,70 30,65 40,65 Z" fill="#4c1d95" /> <!-- left arm -->
  </g>
</svg>