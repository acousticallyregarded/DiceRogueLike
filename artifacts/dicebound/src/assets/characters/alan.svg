<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M 40,95 L 45,60 L 55,60 L 60,95 Z" fill="#78350f" /> <!-- legs -->
    <path d="M 30,65 C 30,40 40,35 50,35 C 60,35 70,40 70,65 Z" fill="#15803d" /> <!-- tunic -->
    <circle cx="50" cy="28" r="14" fill="#fed7aa" /> <!-- head -->
    <path d="M 32,28 Q 50,15 68,28 Q 50,22 32,28 Z" fill="#14532d" /> <!-- hat base -->
    <path d="M 60,24 Q 75,5 90,15 Q 75,15 60,24 Z" fill="#ef4444" /> <!-- feather -->
    <ellipse cx="45" cy="55" rx="16" ry="12" fill="#d97706" transform="rotate(-25 45 55)" /> <!-- lute body -->
    <circle cx="45" cy="55" r="4" fill="#451a03" /> <!-- lute hole -->
    <line x1="45" y1="55" x2="20" y2="35" stroke="#92400e" stroke-width="4" stroke-linecap="round" /> <!-- lute neck -->
    <line x1="25" y1="40" x2="20" y2="35" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" /> <!-- lute head -->
    <path d="M 65,45 C 75,50 80,60 70,65" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" /> <!-- right arm -->
  </g>
</svg>